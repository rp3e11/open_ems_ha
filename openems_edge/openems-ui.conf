# nginx server block for the bundled OpenEMS UI.
#
# Serves the Angular SPA on port 8766 and reverse-proxies the two
# backend channels the UI expects:
#   /openems-edge  -> WebSocket controller (Controller.Api.Websocket)
#   /rest          -> REST controller        (Controller.Api.Rest)
#
# Both targets only exist once the user has configured the matching
# Controller component in the Felix Web Console; until then those
# paths will 502.

server {
    listen 8766 default_server;
    listen [::]:8766 default_server;
    server_name _;

    root /var/www/html/openems;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        error_page 404 /index.html;
    }

    location /openems-edge {
        proxy_pass http://127.0.0.1:8764;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 1d;
    }

    location /rest {
        proxy_pass http://127.0.0.1:8084/rest;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }
}
